<!-- Table settings menu — icon-only filter button opening a grouped
     settings panel. Include inside an x-data="paginated(...)" scope
     where `cols` is defined: [{ key, label }] matching the cell keys
     passed to colShown()/th-sort. Entries marked `locked: true` (e.g.
     sticky identity columns) are not offered.
     Sections: column visibility, rows per page, density — extend with
     more table settings here as they land. -->
<div class="relative" x-data="dropdown">
  <button
    type="button"
    x-ref="trigger"
    class="btn btn-secondary btn-icon"
    :aria-label="$t('tableSettings')"
    :title="$t('tableSettings')"
    aria-haspopup="true"
    :aria-expanded="open"
    :aria-controls="$id('menu-cols')"
    @click="toggle()"
    @keydown="onTriggerKeydown"
  >
    <span x-html="$icon('funnel', 'size-4', 'regular')" aria-hidden="true"></span>
  </button>
  <div
    x-ref="menu"
    :id="$id('menu-cols')"
    role="menu"
    :aria-label="$t('tableSettings')"
    x-show="open"
    x-cloak
    x-transition.origin.top.right
    @click.outside="close(false)"
    @keydown="onMenuKeydown"
    :class="dropUp ? 'bottom-full mb-2' : 'mt-2'"
    class="menu-panel absolute right-0 z-20 w-max min-w-52 max-w-[calc(100vw-2rem)] space-y-0.5 overflow-hidden p-1.5"
  >
    <template x-if="typeof cols !== 'undefined' && cols.length">
      <p class="px-3 pb-1 pt-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="$t('columnsLabel')"></p>
    </template>
    <template x-for="col in (typeof cols === 'undefined' ? [] : cols).filter(c => !c.locked)" :key="col.key">
      <button
        type="button"
        role="menuitemcheckbox"
        :aria-checked="colShown(col.key)"
        class="menu-item w-full rounded-[10px]"
        @click="toggleCol(col.key)"
      >
        <span
          class="flex size-4 items-center justify-center text-primary-600 dark:text-primary-400"
          :class="!colShown(col.key) && 'invisible'"
          x-html="$icon('checkPlain', 'size-3.5', 'bold')"
          aria-hidden="true"
        ></span>
        <span x-text="$t(col.label)"></span>
      </button>
    </template>

    <template x-if="typeof perPage !== 'undefined'">
      <div>
        <div class="mx-1 my-1.5 border-t border-slate-200/70 dark:border-slate-800" role="separator"></div>
        <p class="px-3 pb-1 pt-1.5 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" x-text="$t('rowsPerPage')"></p>
      </div>
    </template>
    <template x-for="n in (typeof perPage === 'undefined' ? [] : [5, 10, 20])" :key="n">
      <button
        type="button"
        role="menuitemradio"
        :aria-checked="perPage === n"
        class="menu-item w-full rounded-[10px]"
        @click="perPage = n; page = 1"
      >
        <span
          class="flex size-4 items-center justify-center text-primary-600 dark:text-primary-400"
          :class="perPage !== n && 'invisible'"
          x-html="$icon('checkPlain', 'size-3.5', 'bold')"
          aria-hidden="true"
        ></span>
        <span x-text="n"></span>
      </button>
    </template>

    <div class="mx-1 my-1.5 border-t border-slate-200/70 dark:border-slate-800" role="separator"></div>

    <template x-if="typeof toggleDense === 'function'">
      <button
        type="button"
        role="menuitemcheckbox"
        :aria-checked="dense"
        class="menu-item w-full rounded-[10px]"
        @click="toggleDense()"
      >
        <span
          class="flex size-4 items-center justify-center text-primary-600 dark:text-primary-400"
          :class="!dense && 'invisible'"
          x-html="$icon('checkPlain', 'size-3.5', 'bold')"
          aria-hidden="true"
        ></span>
        <span x-text="$t('compactDensity')"></span>
      </button>
    </template>
  </div>
</div>
