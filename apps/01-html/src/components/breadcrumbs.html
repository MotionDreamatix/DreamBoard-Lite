<!-- Breadcrumbs — include where a `crumbs` array is in scope:
     [{ label, href? }] — last item renders as current page (aria-current).
     WCAG: nav landmark with localized label, ol order conveys hierarchy. -->
<nav :aria-label="$t('breadcrumb')" class="mb-5">
  <ol class="flex flex-wrap items-center gap-1.5 text-sm">
    <template x-for="(c, i) in crumbs" :key="c.label">
      <li class="flex items-center gap-1.5">
        <span
          x-show="i > 0"
          class="text-slate-400 dark:text-slate-500"
          x-html="$icon('chevronRight', 'size-3.5')"
          aria-hidden="true"
        ></span>
        <template x-if="i < crumbs.length - 1">
          <a
            :href="c.href"
            class="rounded text-slate-500 transition-colors duration-200 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200"
            x-text="$t(c.label)"
          ></a>
        </template>
        <template x-if="i === crumbs.length - 1">
          <span class="font-medium text-slate-800 dark:text-slate-100" aria-current="page" x-text="$t(c.label)"></span>
        </template>
      </li>
    </template>
  </ol>
</nav>
