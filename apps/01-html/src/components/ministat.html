<!-- Mini stat card — include inside `x-for="s in …"` (binds `s`).
     s: { label, value, format?, icon } -->
<article class="card flex items-center gap-4 p-5">
  <span
    class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary-600 dark:bg-primary-500/10 dark:text-primary-300"
    x-html="$icon(s.icon, 'size-6')"
    aria-hidden="true"
  ></span>
  <div class="min-w-0">
    <p class="truncate text-sm font-medium text-slate-500 dark:text-slate-400" x-text="$t(s.label)"></p>
    <p class="mt-0.5 text-xl font-bold tracking-tight tabular-nums text-slate-900 dark:text-white" x-text="fmt(s.value, s.format)"></p>
  </div>
</article>
