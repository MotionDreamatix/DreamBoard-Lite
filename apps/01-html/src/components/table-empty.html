<!-- Empty state row — include as the last <tr> inside a paginated <tbody>.
     Shown when the current filter/search yields zero rows. colspan="99"
     safely spans any column count (browsers clamp to the real number). -->
<tr x-show="!pageItems.length" x-cloak>
  <td colspan="99" class="px-5 py-12">
    <div role="status" class="flex flex-col items-center gap-2 text-center">
      <span
        class="flex size-10 items-center justify-center rounded-xl bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500"
        x-html="$icon('tray', 'size-5')"
        aria-hidden="true"
      ></span>
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-200" x-text="$t('emptyTitle')"></p>
      <p class="text-xs text-slate-500 dark:text-slate-400" x-text="$t('emptyHint')"></p>
    </div>
  </td>
</tr>
