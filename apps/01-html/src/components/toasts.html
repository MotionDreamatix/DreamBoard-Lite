<!-- Toast stack — WCAG: role="log" container announces added items
     (polite), each toast carries an icon + title + optional body and a
     close button. Items auto-dismiss via $store.toasts ttl. -->
<div
  role="log"
  aria-live="polite"
  :aria-label="$t('toastsLabel')"
  class="pointer-events-none fixed inset-x-4 bottom-4 z-80 flex w-full flex-col gap-2 sm:inset-x-auto sm:right-4 sm:max-w-sm print:hidden"
>
  <template x-for="t in $store.toasts.items" :key="t.id">
    <div
      class="menu-panel pointer-events-auto flex items-start gap-3 p-4 shadow-soft"
      x-transition:enter="transition ease-out duration-300 motion-reduce:duration-0"
      x-transition:enter-start="translate-y-2 opacity-0"
      x-transition:enter-end="translate-y-0 opacity-100"
      x-transition:leave="transition ease-in duration-200 motion-reduce:duration-0"
      x-transition:leave-start="translate-y-0 opacity-100"
      x-transition:leave-end="translate-y-2 opacity-0"
    >
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-lg"
        :class="badge(t.variant)"
        x-html="$icon({ success: 'check', warning: 'alert', danger: 'alert', info: 'info', primary: 'star' }[t.variant] ?? 'bell', 'size-4')"
        aria-hidden="true"
      ></span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-slate-900 dark:text-white" x-text="$t(t.title)"></p>
        <p x-show="t.body" class="mt-0.5 text-xs leading-relaxed text-slate-500 dark:text-slate-400" x-text="t.body"></p>
      </div>
      <button
        type="button"
        class="shrink-0 rounded-lg p-1 text-slate-400 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
        :aria-label="$t('dismissToast')"
        @click="$store.toasts.dismiss(t.id)"
      >
        <span x-html="$icon('close', 'size-4', 'regular')" aria-hidden="true"></span>
      </button>
    </div>
  </template>
</div>
