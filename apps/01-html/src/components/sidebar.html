<!-- Sidebar: static rail on lg+, off-canvas drawer with backdrop on mobile.
     On desktop it can also collapse to an icon-only rail (persisted);
     nav groups then open as anchored flyout panels instead of accordions.
     WCAG 2.2 AA: inert when closed on mobile (not focusable/announced),
     focus trap while open, Escape closes. -->
<div
  x-show="$store.sidebar.open && !$store.sidebar.desktop"
  x-transition.opacity
  class="fixed inset-0 z-40 bg-slate-900/60 lg:hidden print:hidden"
  aria-hidden="true"
  @click="$store.sidebar.close()"
></div>

<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-slate-200/60 bg-white transition-[width,transform] duration-200 ease-out motion-reduce:transition-none lg:translate-x-0 print:hidden dark:border-slate-800/60 dark:bg-slate-900"
  :class="[
    $store.sidebar.open ? 'translate-x-0' : '-translate-x-full',
    $store.sidebar.rail && 'lg:w-20',
  ]"
  :inert="!$store.sidebar.open && !$store.sidebar.desktop"
  x-trap.noscroll="$store.sidebar.open && !$store.sidebar.desktop"
  @keydown.escape.window="$store.sidebar.close()"
  x-init="$watch('$store.sidebar.open', (v) => v && $nextTick(() => $el.querySelector('a, button')?.focus()))"
  :aria-label="$t('ariaSidebar')"
>
  <!-- Brand -->
  <div
    class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-200/60 px-5 transition-[padding] duration-200 motion-reduce:transition-none dark:border-slate-800/60"
    :class="$store.sidebar.rail && 'lg:px-[22px]'"
  >
    <!-- rounded-xl matches the flush inner tile (radius rule: inner = outer − 0 gap) -->
    <a href="index.html" class="flex items-center gap-3 rounded-xl">
      <span
        class="flex size-9 items-center justify-center rounded-xl bg-primary-600 text-white shadow-soft"
        aria-hidden="true"
        ><span x-html="$icon('grid', 'size-5')"></span
      ></span>
      <span class="min-w-0" :class="$store.sidebar.rail && 'lg:hidden'">
        <span class="block truncate text-sm font-bold tracking-tight text-slate-900 dark:text-white" x-text="d.site.name"></span>
        <span class="block truncate text-xs text-slate-500 dark:text-slate-400" x-text="$t(d.site.tagline)"></span>
      </span>
    </a>
    <!-- WCAG: icon-only button carries an accessible name -->
    <button
      type="button"
      class="ml-auto rounded-lg p-2 text-slate-500 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-800 lg:hidden dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
      :aria-label="$t('closeSidebar')"
      @click="$store.sidebar.close()"
    >
      <span x-html="$icon('close', 'size-5', 'regular')"></span>
    </button>
  </div>

  <!-- Navigation -->
  <nav
    :aria-label="$t('ariaMainNav')"
    class="flex-1 overflow-y-auto overflow-x-clip px-4 py-5"
    @scroll.passive="$store.sidebar.railFlyout = null"
  >
    <!-- Icon-rail toggle (desktop only) -->
    <div class="mb-3 hidden lg:block">
      <button
        type="button"
        class="menu-item w-full"
        :class="$store.sidebar.rail && 'lg:px-3.5'"
        :aria-pressed="$store.sidebar.rail"
        :aria-label="$store.sidebar.rail ? $t('expandSidebar') : $t('collapseSidebar')"
        @click="$store.sidebar.toggleRail()"
      >
        <span
          class="shrink-0 text-slate-400 transition-transform duration-200 motion-reduce:transition-none"
          :class="$store.sidebar.rail && 'lg:rotate-180'"
          x-html="$icon('sidebar', 'size-5', 'regular')"
          aria-hidden="true"
        ></span>
        <span :class="$store.sidebar.rail && 'lg:hidden'" x-text="$t('collapseSidebar')"></span>
      </button>
    </div>

    <ul class="space-y-1">
      <template x-for="(item, i) in d.nav" :key="item.label">
        <li>
          <!-- Group with children → disclosure button + nested list (accordion),
               or anchored flyout panel when the rail is collapsed -->
          <template x-if="item.children">
            <div class="relative">
              <button
                type="button"
                class="menu-item w-full justify-between"
                :class="$store.sidebar.rail && 'lg:px-3.5'"
                :aria-expanded="$store.sidebar.rail && $store.sidebar.desktop
                  ? $store.sidebar.railFlyout === item.label
                  : $store.sidebar.isGroupOpen(item.label)"
                :aria-controls="$store.sidebar.rail && $store.sidebar.desktop ? 'nav-flyout' : 'nav-sub-' + i"
                @click="$store.sidebar.rail && $store.sidebar.desktop
                  ? $store.sidebar.toggleFlyout(item.label, $el)
                  : $store.sidebar.toggleGroup(item.label)"
                @mouseenter="$store.sidebar.rail && $store.sidebar.desktop && $store.sidebar.openFlyout(item.label, $el)"
                @mouseleave="$store.sidebar.scheduleFlyoutClose()"
              >
                <span class="flex items-center gap-3">
                  <span x-html="$icon(item.icon)" class="icon-duotone-accent shrink-0 text-slate-400"></span>
                  <span x-text="$t(item.label)" :class="$store.sidebar.rail && 'lg:hidden'"></span>
                </span>
                <span
                  class="shrink-0 transition-transform duration-200 motion-reduce:transition-none"
                  :class="[
                    $store.sidebar.isGroupOpen(item.label) && 'rotate-180',
                    $store.sidebar.rail && 'lg:hidden',
                  ]"
                  x-html="$icon('chevronDown', 'size-4')"
                  aria-hidden="true"
                ></span>
              </button>

              <!-- Expanded mode: in-place accordion — .nav-acc animates
                   grid-rows (height) + a slight lift; inert keeps the
                   collapsed links out of the tab order. -->
              <div
                class="nav-acc mt-1"
                :class="!$store.sidebar.rail && $store.sidebar.isGroupOpen(item.label) && 'nav-acc-open'"
                :inert="$store.sidebar.rail || !$store.sidebar.isGroupOpen(item.label)"
              >
                <!-- p-1/-m-1 is a zero-layout bleed: .nav-acc clips its
                     child for the grid-rows collapse, which would also
                     clip each item's focus ring (ring + offset ≈ 4px
                     past the item box). The padding gives the ring
                     room; the negative margin keeps geometry identical. -->
                <ul :id="'nav-sub-' + i" class="-m-1 space-y-1 p-1">
                  <template x-for="sub in item.children" :key="sub.label">
                    <li>
                      <a
                        :href="sub.href"
                        class="menu-item py-1.5 pl-11 text-[13px]"
                        :class="isCurrent(sub.href) && 'menu-item-active'"
                        :aria-current="isCurrent(sub.href) ? 'page' : null"
                        x-text="$t(sub.label)"
                      ></a>
                    </li>
                  </template>
                </ul>
              </div>

            </div>
          </template>

          <!-- Plain link -->
          <template x-if="!item.children">
            <a
              :href="item.href"
              class="menu-item"
              :class="[
                isCurrent(item.href) && 'menu-item-active',
                $store.sidebar.rail && 'lg:px-3.5',
              ]"
              :aria-current="isCurrent(item.href) ? 'page' : null"
              :title="$store.sidebar.rail ? item.label : null"
              @click="$store.sidebar.closeGroups()"
              @mouseenter="$store.sidebar.railFlyout = null"
            >
              <span x-html="$icon(item.icon)" class="icon-duotone-accent shrink-0" :class="isCurrent(item.href) ? 'text-primary-600 dark:text-primary-300' : 'text-slate-400'"></span>
              <span x-text="$t(item.label)" :class="$store.sidebar.rail && 'lg:hidden'"></span>
            </a>
          </template>
        </li>
      </template>
    </ul>
  </nav>

  <!-- Sidebar footer: plan quota meter + signed-in user summary.
       Collapses to a centered avatar in rail mode. -->
  <div class="shrink-0 border-t border-slate-200/60 p-4 dark:border-slate-800/60">
    <div
      class="mb-3 overflow-hidden whitespace-nowrap rounded-xl border border-primary-200/70 bg-primary-50/80 p-3 dark:border-primary-500/25 dark:bg-primary-500/10"
      :class="$store.sidebar.rail && 'lg:hidden'"
    >
      <p class="text-xs font-semibold text-slate-800 dark:text-slate-100" x-text="$t('DreamBoard Lite')"></p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400" x-text="$t('Free edition — the full kit has 56 pages plus React & fullstack editions')"></p>
      <a href="https://motiondreamatix.gumroad.com/l/dreamboard" target="_blank" rel="noopener" class="btn btn-primary mt-2 w-full justify-center text-xs" x-text="$t('Get the full kit')"></a>
    </div>
    <div class="flex items-center gap-3 transition-[padding] duration-200 motion-reduce:transition-none" :class="$store.sidebar.rail && 'lg:px-1.5'">
      <span
        class="flex size-9 shrink-0 items-center justify-center rounded-full bg-primary-100 text-xs font-bold text-primary-700 dark:bg-primary-500/15 dark:text-primary-300"
        x-text="initials(d.user.name)"
        aria-hidden="true"
      ></span>
      <div class="min-w-0" :class="$store.sidebar.rail && 'lg:hidden'">
        <p class="truncate text-sm font-semibold text-slate-800 dark:text-slate-100" x-text="d.user.name"></p>
        <p class="truncate text-xs text-slate-500 dark:text-slate-400" x-text="$t(d.user.role)"></p>
      </div>
    </div>
  </div>

  <!-- Rail mode: single flyout panel bound to the open group (lives in
       <aside>, not the clipped nav — overflow-x can't be visible beside
       overflow-y:auto). Top offset comes from the clicked trigger. -->
  <div
    x-show="$store.sidebar.rail && $store.sidebar.desktop && $store.sidebar.railFlyoutGroup"
    x-cloak
    x-transition.opacity
    role="menu"
    id="nav-flyout"
    :aria-label="$t($store.sidebar.railFlyout ?? '')"
    class="menu-panel absolute start-[5.5rem] z-50 w-max min-w-48 max-w-[calc(100vw-6.5rem)] p-1.5 before:absolute before:-start-2 before:inset-y-0 before:w-2 before:content-['']"
    :style="'top: ' + $store.sidebar.flyoutTop + 'px'"
    @mouseenter="$store.sidebar.cancelFlyoutClose()"
    @mouseleave="$store.sidebar.scheduleFlyoutClose()"
    @click.outside="!$event.target.closest('#sidebar button[aria-controls]') && ($store.sidebar.railFlyout = null)"
    @keydown.escape="$store.sidebar.railFlyout = null; $nextTick(() => $store.sidebar.flyoutEl?.focus())"
  >
    <p
      class="px-3 pb-1.5 pt-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400"
      x-text="$t($store.sidebar.railFlyout ?? '')"
    ></p>
    <ul>
      <template x-for="sub in $store.sidebar.railFlyoutGroup?.children ?? []" :key="sub.label">
        <li>
          <a
            :href="sub.href"
            role="menuitem"
            class="menu-item rounded-[10px]"
            :class="isCurrent(sub.href) && 'menu-item-active'"
            :aria-current="isCurrent(sub.href) ? 'page' : null"
            x-text="$t(sub.label)"
          ></a>
        </li>
      </template>
    </ul>
  </div>
</aside>
