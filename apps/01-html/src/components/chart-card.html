<!-- One chart showcase card — include inside `x-for="c in d.pages…cards"`.
     `c` = spec {key,title,sub,type,labels,series,wide?}; the Apex options
     are built by apexSpec() in app.js. The sr-only table mirrors the data:
     flat series → label/value rows, named series → labels × series grid. -->
<section
  class="card p-5"
  :class="c.wide && 'md:col-span-2'"
  x-data="{ ...apexChart(c), ...worldMapView(), countries: c.countries ?? [], mapLimit: c.mapLimit ?? 5 }"
  :aria-labelledby="'chart-' + c.key"
>
  <h2 :id="'chart-' + c.key" class="card-title" x-text="$t(c.title)"></h2>
  <p x-show="c.sub" class="card-sub" x-text="$t(c.sub)"></p>
  <!-- No role/label on the container: Apex renders interactive legend/
       tooltip controls inside; the sr-only table below is the equivalent. -->
  <div x-ref="chart" x-show="c.type !== 'world'" class="mt-3 w-full" :class="c.live && 'live-chart'"></div>
  <template x-if="c.type === 'world'">
    <div class="mt-3">{{> components/world-map}}</div>
  </template>

  <!-- Screen-reader equivalent of the chart data -->
  <template x-if="c.series && typeof c.series[0] === 'number'">
    <table class="sr-only">
      <caption x-text="$t(c.title)"></caption>
      <thead>
        <tr>
          <th scope="col" x-text="$t('Label')"></th>
          <th scope="col" x-text="$t('Value')"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="(l, i) in c.labels" :key="l">
          <tr>
            <th scope="row" x-text="$t(l)"></th>
            <td x-text="c.series[i]"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </template>
  <template x-if="c.series && typeof c.series[0] !== 'number'">
    <table class="sr-only">
      <caption x-text="$t(c.title)"></caption>
      <thead>
        <tr>
          <th scope="col" x-text="$t('Category')"></th>
          <template x-for="(s, si) in c.series" :key="si">
            <th scope="col" x-text="s.name ? $t(s.name) : $t(c.title)"></th>
          </template>
        </tr>
      </thead>
      <tbody>
        <template x-for="(l, i) in c.labels" :key="l">
          <tr>
            <th scope="row" x-text="$t(l)"></th>
            <template x-for="(s, si) in c.series" :key="si">
              <td x-text="cellText(s.data[i])"></td>
            </template>
          </tr>
        </template>
      </tbody>
    </table>
  </template>
</section>
