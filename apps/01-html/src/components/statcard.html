<!-- KPI stat card — include inside `x-for="s in …"` (binds `s`).
     s: { id, label, value, format, delta, deltaDir, deltaLabel, icon, spark[] } -->
<article class="card p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-slate-500 dark:text-slate-400" x-text="$t(s.label)"></p>
      <p
        class="mt-1.5 truncate text-2xl font-bold tracking-tight tabular-nums text-slate-900 dark:text-white"
        x-text="fmt(s.value, s.format)"
      ></p>
    </div>
    <span
      class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary-600 dark:bg-primary-500/10 dark:text-primary-300"
      x-html="$icon(s.icon, 'size-6')"
      aria-hidden="true"
    ></span>
  </div>
  <div class="mt-4 flex items-end justify-between gap-2">
    <p class="flex items-center gap-1.5 text-xs">
      <span
        class="flex items-center gap-0.5 font-semibold tabular-nums"
        :class="s.deltaDir === 'up' ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'"
      >
        <span x-html="$icon(s.deltaDir === 'up' ? 'arrowUp' : 'arrowDown', 'size-3.5')" aria-hidden="true"></span>
        <span x-text="s.delta"></span>
      </span>
      <span class="text-slate-500 dark:text-slate-400" x-text="$t(s.deltaLabel)"></span>
    </p>
    <!-- Sparkline trend hint; delta text nearby carries the same info -->
    <div
      x-data="sparkline(s.spark)"
      role="img"
      :aria-label="$t('trendAria', { label: $t(s.label) })"
      class="h-9 w-24 shrink-0"
    ></div>
  </div>
</article>
