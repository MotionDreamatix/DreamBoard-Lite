<!-- Bulk-action bar — include inside an x-data="paginated(...)" scope;
     appears above the table while `selected` is non-empty. -->
<div x-show="selected.length" x-cloak class="bulk-bar" role="group" :aria-label="$t('bulkActions')">
  <p class="text-xs font-semibold text-primary-700 dark:text-primary-300" x-text="$t('selectedCount', { n: selected.length })"></p>
  <button
    type="button"
    class="ml-auto text-xs font-medium text-slate-600 transition-colors duration-200 hover:text-slate-900 hover:underline dark:text-slate-300 dark:hover:text-white"
    @click="selected = []"
    x-text="$t('Cancel')"
  ></button>
  <button
    type="button"
    class="text-xs font-medium text-rose-600 transition-colors duration-200 hover:text-rose-700 hover:underline dark:text-rose-400"
    @click="selected = []; $store.toasts.push({ title: $t('toastDemoAction'), variant: 'info' })"
    x-text="$t('Delete')"
  ></button>
</div>
