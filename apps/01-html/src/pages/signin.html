{{@layout "blank"}}
{{@var title "Sign in"}}

<div class="w-full max-w-sm">
  <div class="card p-8">
    <a href="index.html" class="flex items-center gap-2.5">
      <span class="flex size-9 items-center justify-center rounded-xl bg-primary-600 text-white" x-html="$icon('dashboard', 'size-5')" aria-hidden="true"></span>
      <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white" x-text="d.site.name"></span>
    </a>

    <h1 class="mt-7 auth-title" x-text="$t(d.pages.auth.signin.heading)"></h1>
    <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400" x-text="$t(d.pages.auth.signin.sub)"></p>

    <!-- Social providers -->
    <div class="mt-6 grid grid-cols-2 gap-3">
      <template x-for="p in d.pages.auth.signin.providers" :key="p.name">
        <button type="button" class="btn btn-secondary w-full justify-center" @click="socialAuth(p)">
          <span x-html="$icon(p.icon, 'size-4.5', 'fill')" aria-hidden="true"></span>
          <span x-text="p.name"></span>
        </button>
      </template>
    </div>

    <div class="mt-6 flex items-center gap-3" aria-hidden="true">
      <span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>
      <span class="text-xs font-medium tracking-wide text-slate-500 uppercase dark:text-slate-400" x-text="$t('orDivider')"></span>
      <span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>
    </div>

    <form action="index.html" method="get" class="mt-6 space-y-4" x-data="auth('signin')" @submit="submit">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" x-text="$t('emailLabel')"></label>
        <input id="email" name="email" type="email" autocomplete="email" required class="input" :placeholder="$t('you@company.com')" />
      </div>
      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" x-text="$t('passwordLabel')"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="input" placeholder="••••••••" />
      </div>

      <div class="flex items-center justify-between gap-3">
        <label class="flex cursor-pointer items-center gap-2.5 text-sm text-slate-600 dark:text-slate-300">
          <input type="checkbox" name="remember" class="peer sr-only" />
          <span
            class="check"
            aria-hidden="true"
            x-html="$icon('checkPlain', 'size-3.5', 'bold')"
          ></span>
          <span x-text="$t('keepSignedIn')"></span>
        </label>
        <a href="forgot.html" class="text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300" x-text="$t('forgotPassword')"></a>
      </div>

      <template x-if="error">
        <p role="alert" class="text-sm font-medium text-rose-600 dark:text-rose-400" x-text="error"></p>
      </template>

      <button type="submit" class="btn btn-primary w-full justify-center" :disabled="pending" x-text="$t('signIn')"></button>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
    <span x-text="$t('noAccount')"></span>
    <a href="signup.html" class="font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300" x-text="$t('signUp')"></a>
  </p>
</div>
