{{@layout "base"}}
{{@var title "Reports"}}
{{@var phH "d.pages.reports.heading"}}
{{@var phS "d.pages.reports.sub"}}

<!-- Page heading -->
<div class="page-head">
  {{> components/page-heading}}
  <a href="report-new.html" class="btn btn-primary">
    <span x-html="$icon('plus', 'size-4', 'regular')" aria-hidden="true"></span>
    <span x-text="$t('New report')"></span>
  </a>
</div>

<!-- ── Summary cards ──────────────────────────────────────────────── -->
<section :aria-label="$t('Report summary')" class="grid gap-4 sm:grid-cols-3">
  <template x-for="s in d.pages.reports.stats" :key="s.label">
    {{> components/ministat}}
  </template>
</section>

<!-- ── Reports table ──────────────────────────────────────────────── -->
<section class="card mt-4" aria-labelledby="reports-table-title" x-data="{
  cols: [
    { key: 'name', label: 'Report' },
    { key: 'range', label: 'Period' },
    { key: 'created', label: 'Created' },
    { key: 'format', label: 'Format' },
    { key: 'size', label: 'Size', sort: false },
    { key: 'status', label: 'Status', sort: false },
  ],
  ...paginated(() => d.pages.reports.items, 5),
}">
  <div class="card-head">
    <h2 id="reports-table-title" class="card-title" x-text="$t('All reports')"></h2>
    <div class="flex flex-wrap items-center gap-3">
      {{> components/table-search}}
      {{> components/col-toggle}}
    </div>
  </div>
  <div class="overflow-x-auto" :class="dense && 'table-dense'" tabindex="0">
    <table class="w-full min-w-180 text-left text-sm">
      <thead>
        <tr class="th-row">
          <template x-for="col in cols.filter(c => c.sort !== false)" :key="col.key">
            {{> components/th-sort}}
          </template>
          <th scope="col" class="px-5 py-3" x-show="colShown('size')" x-text="$t('Size')"></th>
          <th scope="col" class="px-5 py-3" x-show="colShown('status')" x-text="$t('Status')"></th>
          <th scope="col" class="px-5 py-3"><span class="sr-only" x-text="$t('Actions')"></span></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
        <template x-for="r in pageItems" :key="r.id">
          <tr class="transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40">
            <td class="px-5 py-3.5" x-show="colShown('name')">
              <div class="flex items-center gap-3">
                <span
                  class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400"
                  x-html="$icon('file', 'size-4')"
                  aria-hidden="true"
                ></span>
                <div class="min-w-0">
                  <p class="truncate font-medium text-slate-900 dark:text-white" x-text="r.name"></p>
                  <p class="text-xs tabular-nums text-slate-500 dark:text-slate-400" x-text="r.id"></p>
                </div>
              </div>
            </td>
            <td class="px-5 py-3.5 whitespace-nowrap text-slate-600 dark:text-slate-300" x-show="colShown('range')" x-text="$t(r.range)"></td>
            <td class="px-5 py-3.5 whitespace-nowrap text-slate-600 dark:text-slate-300" x-show="colShown('created')" x-text="fmtDate(r.created)"></td>
            <td class="px-5 py-3.5" x-show="colShown('format')">
              <span class="inline-flex rounded-md bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300" x-text="$t(r.format)"></span>
            </td>
            <td class="px-5 py-3.5 whitespace-nowrap tabular-nums text-slate-600 dark:text-slate-300" x-show="colShown('size')" x-text="r.size"></td>
            <td class="px-5 py-3.5" x-show="colShown('status')">
              <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium capitalize" :class="badge(statusVariant(r.status))" x-text="$t(r.status)"></span>
            </td>
            <td class="px-5 py-3.5">
              <button
                type="button"
                class="btn btn-ghost size-9 cursor-pointer rounded-lg p-0"
                :disabled="r.status !== 'ready'"
                :class="r.status !== 'ready' && 'cursor-not-allowed opacity-40'"
                :aria-label="$t('downloadName', { name: r.name })"
                @click="reportDownload(r)"
              >
                <span x-html="$icon('download', 'size-4', 'regular')" aria-hidden="true"></span>
              </button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  {{> components/pagination}}
</section>
