{{@layout "blank"}}
{{@var title "Server error"}}

<div class="w-full max-w-sm text-center">
  <span
    class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400"
    x-html="$icon('alert', 'size-7')"
    aria-hidden="true"
  ></span>
  <p class="mt-5 text-7xl font-bold tracking-tight text-rose-600 dark:text-rose-400">500</p>
  <h1 class="mt-4 auth-title" x-text="$t(d.pages.auth.serverError.heading)"></h1>
  <p class="mt-2 text-sm leading-relaxed text-slate-500 dark:text-slate-400" x-text="$t(d.pages.auth.serverError.sub)"></p>
  <div class="mt-6 flex justify-center gap-3">
    <button type="button" class="btn btn-primary" @click="location.reload()" x-text="$t('tryAgain')"></button>
    <a href="index.html" class="btn btn-secondary" x-text="$t('Back to dashboard')"></a>
  </div>
  <p class="mt-8 text-xs text-slate-500 dark:text-slate-400">
    {{> components/brand-note}}
  </p>
</div>
